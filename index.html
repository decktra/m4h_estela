<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estela · Meals4Hope</title>
  <meta name="description" content="La página web de Estela está en construcción. Escríbenos a estela@meals4hope.org para saber más sobre el proyecto o cómo apoyarlo.">
  <link rel="icon" type="image/png" href="assets/logo-estela.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #6c007f;        /* Estela logo */
      --purple-soft: #f6eef8;
      --blue: #6089d1;          /* meals4hope.org accent */
      --blue-dark: #4875b6;
      --text: #474747;
      --bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      font-family: "Open Sans", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .intro { max-width: 500px; }

    .logo {
      display: block;
      width: 100%;
      max-width: 380px;
      height: auto;
      margin: 0 0 8px -12px;
    }

    .tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-dark);
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(26px, 3.2vw, 36px);
      line-height: 1.25;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 20px;
    }

    p { font-size: 17px; margin-bottom: 28px; }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--purple);
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: background .2s, transform .2s;
      word-break: break-all;
    }
    .email:hover, .email:focus-visible { background: #55006a; transform: translateY(-2px); }
    .email svg { flex-shrink: 0; }

    .closing {
      margin-top: 28px;
      font-weight: 600;
      color: var(--purple);
    }

    /* dashed flourish echoing the logo */
    .dash {
      width: 120px;
      height: 0;
      border-top: 3px dashed var(--purple);
      opacity: .5;
      margin: 0 0 28px;
    }

    .photo {
      justify-self: end;
      width: 100%;
      max-width: 520px;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 20px 50px -20px rgba(72, 117, 182, .45);
    }

    footer {
      border-top: 1px solid var(--blue);
      padding: 18px 24px;
      text-align: center;
      font-size: 14px;
    }
    footer a { color: var(--blue-dark); font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        gap: 40px;
        padding: 32px 16px;
      }
      .intro { max-width: none; text-align: center; }
      .logo { margin: 0 auto 4px; max-width: 300px; }
      .dash { margin: 0 auto 24px; }
      .photo { justify-self: center; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <img class="logo" src="assets/logo-estela.png" alt="Estela" width="871" height="545">
      <span class="tag">Un proyecto de Meals4Hope</span>
      <h1>Este espacio está tomando forma…</h1>
      <div class="dash" aria-hidden="true"></div>
      <p>La página web de Estela está en construcción, pero si quieres saber más sobre el proyecto o descubrir cómo puedes apoyarlo, escríbenos a:</p>
      <a class="email" href="mailto:estela@meals4hope.org">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
        estela@meals4hope.org
      </a>
      <p class="closing">¡Estaremos encantadas de contártelo!</p>
    </section>

    <figure class="photo">
      <img src="assets/collage.jpg" alt="Collage de fotos de niñas y mujeres participando en los talleres de Estela" width="1100" height="1589">
    </figure>
  </main>

  <footer>
    Estela es un proyecto de <a href="https://www.meals4hope.org/2026/05/13/estela/" target="_blank" rel="noopener">Meals4Hope</a>
  </footer>
</body>
</html>
